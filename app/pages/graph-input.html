<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make A Graph</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/pages/graph-input.css">
</head>
    <body>
            <header>
                <nav>
                    <div class="nav-left">
                        <a href="/home">Home</a>
                        <a href="/graph-input">Make a Graph</a>
                        <a href="/help">Help</a>

                        <!-- this is the graph output/results page. -->
                        <!-- <a href="/graph-output">Graph Output</a> -->
                    </div>

                    <!--  this will download the csv file -->
                    <div class="nav-right">
                        <a href="../static/data/earthquake_data_tsunami.csv">Download CSV</a>
                    </div>
                </nav>
            </header>

            <!-- main content here -->

            <main class="container">


            <section class="card">
                <h1>Make A Graph</h1>
                <p>Here is the prompt for the project.</p>
            

            <!-- -------- GRAPH INPUT SECTION -------- -->


            <!-- graph title input -->
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter Text Here">
            </div>

            <!-- x-axis label and dropdown -->
            <div class="form-row">
                <div class="form-group">
                    <label for="x-label">X Axis label</label>
                    <input type="text" id="x-label" placeholder="Enter Text Here">
            </div>
                <div class="form-group">
                    <label for="x-data">X Axis Data</label>
                    <select id="x-data">
                        <option value="" disabled selected hidden>Select From Dropdown</option>
                        <option value="magnitude">Magnitude</option>
                        <option value="cdi">CDI</option>
                        <option value="mmi">MMI</option>
                        <option value="sig">Significance</option>
                        <option value="nst">NST</option>
                        <option value="dmin">DMIN</option>
                        <option value="gap">GAP</option>
                        <option value="depth">Depth</option>
                        <option value="latitude">Latitude</option>
                        <option value="longitude">Longitude</option>
                        <option value="Year">Year</option>
                        <option value="Month">Month</option>
                        <option value="tsunami">Tsunami</option>
                    </select>
                </div>
            </div>

        <!-- y axis label and dropdown -->
            <div class="form-row">
                <div class="form-group">
                    <label for="y-label">Y Axis label</label>
                    <input type="text" id="y-label" placeholder="Enter Text Here">
                </div>
                <div class="form-group">
                    <label for="y-data">Y Axis Data</label>
                    <select id="y-data">
                        <option value="" disabled selected hidden>Select From Dropdown</option>
                        <option value="magnitude">Magnitude</option>
                        <option value="cdi">CDI</option>
                        <option value="mmi">MMI</option>
                        <option value="sig">Significance</option>
                        <option value="nst">NST</option>
                        <option value="dmin">DMIN</option>
                        <option value="gap">GAP</option>
                        <option value="depth">Depth</option>
                        <option value="latitude">Latitude</option>
                        <option value="longitude">Longitude</option>
                        <option value="Year">Year</option>
                        <option value="Month">Month</option>
                        <option value="tsunami">Tsunami</option>
                    </select>
                </div>
            </div>

            <!-- graph type below both axis rows -->
            <div class="form-row">
                <div class="form-group">
                    <label for="graph-type">Graph Type</label>
                    <select id="graph-type">
                        <option value="" disabled selected hidden>Select From Dropdown</option>
                        <!-- Standard graphs -->
                        <option value="scatter">Scatter Plot</option>
                        <option value="line">Line Plot</option>
                        <option value="bar">Bar Chart</option>
                        <option value="histogram">Histogram</option>
                        <option value="boxplot">Box Plot</option>
                        <option value="heatmap">Heatmap</option>
                        <!-- Special graphs -->
                        <option value="quakes_per_year">Earthquakes Per Year</option>
                        <option value="quakes_per_month">Earthquakes Per Month</option>
                        <option value="avg_mag_per_year">Average Magnitude Per Year</option>
                        <option value="tsunamis_per_year">Tsunamis Per Year</option>
                        <option value="depth_distribution">Depth Distribution</option>
                        <option value="location_map">Location Map</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Optional filters section (latitude/longitude) -->

            <section class="card">
                <h2>Optional Filters</h2>

                    <!-- Latitude between -->
                     <div class="form-group">
                        <label> Latitude Between</label>
                     </div>

                     <div class="form-row">
                        <div class="form-group">
                            <label for="lat-high"> High Value</label>
                            <input id="lat-high" type="text" placeholder="Enter Text Here">
                        </div>

                        <div class="form-group">
                            <label for="lat-low"> Low Value</label>
                            <input id="lat-low" type="text" placeholder="Enter Text Here">
                        </div>
                     </div>

                     <!-- Longitude between -->
                    <div class="form-group">
                        <label> Longitude Between</label>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="long-high"> High Value</label>
                            <input id="long-high" type="text" placeholder="Enter Text Here">
                        
                    </div>

                    <div class="form-group">
                            <label for="long-low"> Low Value</label>
                            <input id="long-low" type="text" placeholder="Enter Text Here">
                        </div>
                    </div>
            </section>
                     
            <!-- submit button area -->
            <div class="submit-section">
                <button id="submit-btn" class="submit-btn">Submit</button>
            </div>


    </main>

    <footer>
    </footer>

    <script src="../static/js/pages/graph-input.js"></script>
    </body>
</html>
