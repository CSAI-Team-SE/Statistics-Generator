<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Output</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/pages/graph-output.css">
</head>

<body>
    <header>
        <nav>
            <div class="nav-left">
                <a href="/home">Home</a>
                <a href="/graph-input">Make a Graph</a>
                <a href="/help">Help</a>

                <!-- this is the graph output/results page. -->
                <!-- <a href="/graph-output">Graph Output</a> -->
            </div>

            <!--  this will download the csv file -->
            <div class="nav-right">
                <a href="../static/data/earthquake_data.csv" download="earthquake_data.csv">Download CSV</a>
            </div>
        </nav>
    </header>


    <main class="container">


    <section class="card">
        <h1>Graph Output</h1>

        <div class="graph-container">
            <!-- this is a placeholder (no js))-->
            <img id="graph-img" style="max-width:100%; border-radius:8px;">
        </div>
    </section>


    <!-- Statistics card  -->

    <section class="card" id="statistics-section">
        <h2>Statistics</h2>

<!-- VARIABLE VALUES (template) -->
        <div class="stats-list">
            <p><strong>Mean X:</strong> <span id="mean-x"></span></p>
            <p><strong>Mean Y:</strong> <span id="mean-y"></span></p>
            <p><strong>Range X:</strong> <span id="range-x"></span></p>
            <p><strong>Range Y:</strong> <span id="range-y"></span></p>
            <p><strong>IQR X:</strong> <span id="iqr-x"></span></p>
            <p><strong>IQR Y:</strong> <span id="iqr-y"></span></p>
            <p><strong>P Value:</strong> <span id="p-value"></span></p>
        </div>
    </section>

    <!-- AI analysis card -->

    <section class="card">
        <h2>AI Analysis</h2>

        <div id="ai-output" class="analysis-text ai-output" aria-live="polite">
            <!-- AI analysis will be inserted here -->
             Ask a question about the graph to get insights from the AI! (e.g. "What does this graph tell us about earthquake magnitudes over time?")
        </div>

        <form id="ai-question-form" class="form-group">
            <label for="question">Further Questions:</label>
            <input type="text" id="question" placeholder="Enter question">
            <button type="submit" id="ai-submit-btn" class="submit-btn">Submit</button>
        </form>
        
    </section>
</main>
<script>
window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("graph_result");
    if (!saved) return;

    const result = JSON.parse(saved);

    // Display graph
    document.getElementById("graph-img").src =
        "data:image/png;base64," + result.image;

    // Display stats (if present)
    if (result.stats) {
        document.getElementById("mean-x").textContent = result.stats.mean_x ?? "N/A";
        document.getElementById("mean-y").textContent = result.stats.mean_y ?? "N/A";
        document.getElementById("range-x").textContent = result.stats.range_x ?? "N/A";
        document.getElementById("range-y").textContent = result.stats.range_y ?? "N/A";
        document.getElementById("p-value").textContent = result.stats.p_value ?? "N/A";
        document.getElementById("iqr-x").textContent = result.stats.iqr_x ?? "N/A";
        document.getElementById("iqr-y").textContent = result.stats.iqr_y ?? "N/A";
    }
});
</script>

<!-- This script will handle the AI question form submission separately and display the response -->
<script src="../static/js/pages/graph-output.js"></script>
</body>
</html>
